{{ define "main" }}
<div class="container">
  <header class="section-header">
    <h1>{{ .Title }}</h1>
    {{ with .Content }}<div>{{ . }}</div>{{ end }}
  </header>
  <div class="post-list">
    {{ range .Pages.ByDate.Reverse }}
      {{ partial "fishing-card.html" . }}
    {{ else }}
      <p class="feed-empty">Nothing here yet.</p>
    {{ end }}
  </div>
</div>
{{ end }}

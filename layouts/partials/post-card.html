<article class="post-card">
  <span class="cat cat-{{ .Section }}">{{ .Section }}</span>
  <h2 class="post-card-title"><a href="{{ .Permalink }}">{{ .Title }}</a></h2>
  <div class="post-card-row">
    <time class="post-card-date" datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "Jan 2, 2006" }}</time>
  </div>
  {{ with .Params.summary }}<p class="post-card-summary">{{ . }}</p>{{ end }}
</article>

{{ define "main" }}
<div class="container">
  <article class="article-wrap">
    <header class="post-header">
      <span class="cat cat-investing">Investing</span>
      <h1>{{ .Title }}</h1>
      <div class="post-header-meta">
        <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2, 2006" }}</time>
      </div>
      {{ with .Params.tags }}
      <div class="post-tags">
        {{ range . }}
          {{ with $.Site.GetPage (printf "/tags/%s" .) }}
            {{ partial "tag-pill.html" . }}
          {{ end }}
        {{ end }}
      </div>
      {{ end }}
    </header>

    {{ partial "investing-meta.html" . }}

    <div class="prose">
      {{ .Content }}
    </div>
  </article>
</div>
{{ end }}
